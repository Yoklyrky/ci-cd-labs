services:
  db:
    image: postgres@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: lab-01
      POSTGRES_USER: db-user
      POSTGRES_PASSWORD: db-password
    volumes:
      - db_data:/var/lib/postgresql

  app:
    container_name: app
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://db-user:db-password@db:5432/lab-01

volumes:
  db_data:
